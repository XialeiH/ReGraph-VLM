project_name: visual-shared-unit-paper
primary_model: GPT-5.4 Pro
topic_constraint: |
  === HARD TOPIC CONSTRAINT ===
  The paper MUST be about cross-subject shared-unit modeling for visual cortical fMRI,
  using joint V1/V2/V3/hV4 representations and a staged path toward light interaction
  graphs. The paper may mention dynamic graph reasoning only as future or later-stage
  work unless direct evidence is produced.

  PROHIBITED CONTENT:
  - Do NOT present environment setup, HPC job status, download completion, or I/O fixes as research contributions.
  - Do NOT drift into generic brain decoding, general connectomics, or multimodal video encoding unless directly tied to our stated question.
  - Do NOT claim anatomical one-to-one mapping between individual learned units and single ROIs without new attribution evidence.
  - Do NOT claim semantic unit identity from weak montage evidence alone.
  - Do NOT claim dynamic graph advantages if only static or light interaction graphs were tested.
  - Do NOT claim cross-fold unit identity stability; fold-specific prototype banks are independently trained.
  === END CONSTRAINT ===

frozen_protocols:
  preprocessing:
    roi_blocks: [V1, V2, V3, hV4]
    canonical_space: ROI-block padded canonical concatenated space
    pca_rule: pooled training-subject shared PCA basis
    pca_dim: 512
  dataset_views:
    main: all8_ge2_766
    robustness: all8_ge3_515
    sensitivity: full1000_4subj
  baseline_main:
    name: B4_shared_encoder_nested_val
    rule: leave-one-subject-out outer fold plus validation-subject sweep with aggregate selection
  prototype_main:
    name: prototype_main_top3valsweep_meanprob
    rule: top-3 validation subjects ranked by best_val_top5, mean probabilities aggregation
  writing_claims:
    shared_units_current_definition: >-
      cross-subject latent visual-cortical prototypes learned over the joint V1/V2/V3/hV4
      shared PCA space
    disallowed_current_definition: >-
      single-ROI detector, anatomically localized unit, or semantically resolved object category unit

current_evidence:
  ge2_main:
    prototype_top1: 0.004406
    b4_top1: 0.004080
    prototype_top5: 0.015666
    b4_top5: 0.015666
  ge3_robustness:
    prototype_top1: 0.00534
    b4_top1: 0.00485
    prototype_top5: 0.01723
    b4_top5: 0.02160
  recruitment:
    mean_entropy: 4.0458
    mean_max_activation: 0.0438
    mean_units_above_uniform: 26.35
    mean_units_above_0_05: 0.25
  roi_attribution:
    dominant_counts:
      mixed: 452
      V2: 31
      V1: 18
      V3: 6
      hV4: 5
    mean_concentration: 0.3078
    qualitative_readout: >-
      weak but real ROI preference under support-conditioned attribution, with a mild
      early/mid-visual bias and predominantly mixed units

hard_red_lines:
  - Any claim about prototype superiority must be tied to explicit comparison against B4 and state whether the result is top-1 only or broader.
  - Any claim about sharedness must report the representation compared (prototype activations vs B4 hidden states) and the metric used.
  - Any new method stage must maintain fair baselines with comparable tuning effort.
  - Any claimed useful component must have an ablation.
  - Any result table must map exactly to stored experiment outputs.
  - Any robustness claim must mention whether the conclusion weakens, stays stable, or reverses on all8_ge3_515.

stage3_constraints:
  allowed_main_direction: light interaction modeling over shared units
  disallowed_first_move:
    - full dynamic GNN
    - temporal graph reasoning claims
    - cross-fold unit matching as prerequisite
    - replacing prototype main result as the primary node representation before testing interaction
  required_stage3_comparison:
    - B4_main
    - prototype_main
    - prototype_plus_light_interaction

writing_constraints:
  introduction_min_words: 800
  related_work_min_words: 600
  method_min_words: 1000
  experiments_min_words: 800
  results_min_words: 600
  discussion_min_words: 400
  limitations_min_words: 200
  conclusion_min_words: 200
  figure1_must_exist: true
  figure1_focus: >-
    The staged story: shared units learned over visual cortex, evidence for cross-subject
    sharedness, and the transition to light interaction modeling.
