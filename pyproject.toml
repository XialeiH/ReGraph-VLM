[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regraph-vlm"
version = "0.1.0"
description = "Fixed-order ROI-token brain graph and vision alignment for natural-image fMRI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
clip = [
  "open_clip_torch>=2.24",
]
neuro = [
  "h5py>=3.10",
  "nibabel>=5.2",
  "nilearn>=0.10",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["models"]
