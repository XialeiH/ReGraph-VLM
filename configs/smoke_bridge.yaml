output_root: data/smoke_bridge
seed: 20260312
feature_mode: constant
stability_subset_size: 8
stability_variants: 3
local_audit_max_topology_accuracy: 0.60
local_audit_max_attack_accuracy: 0.75
mean_degree_target: 5.5
mean_degree_tolerance: 1.0
max_clustering_gap: 0.10
max_graph_attempts: 64
noise_levels:
  low:
    intra_cell_rewire: 0.05
    same_side_shortcut: 0.01
    fake_bridge_distractor: 0.00
  med:
    intra_cell_rewire: 0.10
    same_side_shortcut: 0.02
    fake_bridge_distractor: 0.01
  high:
    intra_cell_rewire: 0.20
    same_side_shortcut: 0.05
    fake_bridge_distractor: 0.02
splits:
  train:
    num_graphs: 160
    cell_range: [6, 10]
    cell_size_range: [8, 16]
  val:
    num_graphs: 48
    cell_range: [6, 10]
    cell_size_range: [8, 16]
  id_test:
    num_graphs: 48
    cell_range: [6, 10]
    cell_size_range: [8, 16]
  near_ood:
    num_graphs: 48
    cell_range: [12, 16]
    cell_size_range: [8, 16]
  far_ood:
    num_graphs: 48
    cell_range: [20, 24]
    cell_size_range: [8, 16]
  cell_size_ood:
    num_graphs: 48
    cell_range: [6, 10]
    cell_size_range: [20, 24]
